<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes</title>

    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Poppins:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        body {
            background: #e9ecf1;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }

        /* Top bar */
        .top-bar {
            max-width: 1300px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .back-btn {
            background: #1d2671;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        /* Search form inside top bar */
        .search-form {
            display: flex;
            flex: 1;
            gap: 8px;
        }

        .search-form input {
            flex: 1;
            padding: 9px 34px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .search-form button {
            padding: 9px 18px;
            border-radius: 20px;
            border: none;
            background: #e74c3c;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .search-form button:hover {
            opacity: 0.9;
        }

        /* Notebook */
        .notebook {
            max-width: 1300px;
            margin: auto;
            background: #fff;
            padding: 40px 30px 40px 30px;
            border-radius: 10px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }


        h1 {
            text-align: center;
            font-weight: bolder;
            margin-bottom: 25px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            font-weight: bold;
            font-size: 16px;
            color: #555;
            padding-bottom: 10px;
        }

        thead th:first-child {
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        td {
            padding: 12px 10px;
        }

        /* Date column */
        .date {
            width: 100px;
            color: #e74c3c;
            font-size: 16px;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
            border-right: 2px solid #e74c3c;
        }

        /* Notes text */
        .note-text {
            font-family: 'Patrick Hand', cursive;
            font-size: 16px;
            line-height: 32px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .pagination a {
            padding: 6px 16px;
            border-radius: 18px;
            text-decoration: none;
            background: #1d2671;
            color: #fff;
            font-size: 13px;
        }

        .pagination a.active {
            background: #e74c3c;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        /* Responsive */
        @media(max-width:600px) {
            .notebook {
                padding: 30px 15px 30px 15px;
            }

            .date {
                width: 70px;
                font-size: 13px;
            }

            .note-text {
                font-size: 15px;
                line-height: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <div>
        <a href="/college-studies/" class="back-btn">Back</a>
            </div>
            <div>
        <form class="search-form" method="get">
            <input type="text" name="q" value="{{query}}" placeholder="Search notes ">
            <button type="submit">Search</button>
        </form>
        </div>
    </div>

    <div class="notebook">

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                {% for i in page_obj %}
                <tr>
                    <td class="date">{{i.date|date:'j-m-Y'}}</td>
                    <td class="note-text">{{i.note|title}}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="pagination">
            {% if page_obj.has_previous %}
            <a href="?page={{page_obj.previous_page_number}}">Previous</a>
            {% endif %}
            {% for i in page_obj.paginator.page_range %}
            <a href="?page={{i.number}}" {% if page_obj.number == i %} class="active" {% endif %}>{{i}}</a>
            {% endfor %}
            {% if page_obj.has_next %}
            <a href="?page={{page_obj.next_page_number}}">Next</a>
            {% endif %}
        </div>
    </div>

</body>

</html>
